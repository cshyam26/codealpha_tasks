
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaAI | Language Translator</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <a class="brand" href="/">🌐 LinguaAI</a>
      <span class="tagline">Words connect worlds.</span>
    </header>

    <section class="hero">
      <p class="eyebrow">YOUR MULTILINGUAL COMPANION</p>
      <h1>Say it in <span>any language.</span></h1>
      <p class="subtitle">Translate your words and connect with the world.</p>
    </section>

    <section class="translator">
      <div class="language-bar">
        <label class="language-field">
          <span>TRANSLATE FROM</span>
          <select id="source">
            <option value="en">English</option>
            <option value="te">Telugu</option>
            <option value="hi">Hindi</option>
            <option value="ta">Tamil</option>
            <option value="kn">Kannada</option>
            <option value="ml">Malayalam</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="zh">Chinese</option>
            <option value="ar">Arabic</option>
          </select>
        </label>

        <button id="swap" class="swap" type="button"
          aria-label="Swap languages">⇄</button>

        <label class="language-field">
          <span>TRANSLATE TO</span>
          <select id="target">
            <option value="te">Telugu</option>
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="ta">Tamil</option>
            <option value="kn">Kannada</option>
            <option value="ml">Malayalam</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="zh">Chinese</option>
            <option value="ar">Arabic</option>
          </select>
        </label>
      </div>

      <div class="text-panels">
        <section class="panel">
          <textarea id="inputText" maxlength="500"
            placeholder="Type something to translate..."
            aria-label="Text to translate"></textarea>
          <div class="panel-footer">
            <button id="clear" class="text-button" type="button">Clear</button>
            <span id="counter">0 / 500</span>
          </div>
        </section>

        <section class="panel result-panel">
          <div id="outputText" class="output" aria-live="polite">
            Your translation will appear here...
          </div>
          <div class="panel-footer">
            <span>TRANSLATION</span>
            <div class="result-actions">
              <button id="speak" class="icon-button" type="button"
                aria-label="Listen to translation" title="Listen">🔊</button>
              <button id="copy" class="icon-button" type="button"
                aria-label="Copy translation" title="Copy">📋</button>
            </div>
          </div>
        </section>
      </div>

      <div class="translate-area">
        <p id="status" role="status" aria-live="polite"></p>
        <button id="translate" class="translate-button" type="button">
          Translate now <span>→</span>
        </button>
      </div>
    </section>

    <footer>
      <p>Built by Shyam | LinguaAI</p>
      <p>Connecting people, one translation at a time.</p>
    </footer>
  </main>
</body>
</html>
